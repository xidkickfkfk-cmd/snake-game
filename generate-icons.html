<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<h2>Generating icons...</h2>
<script>
function drawIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    // Background
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, size, size);

    // Snake body (green arc)
    const cx = size / 2, cy = size / 2;
    const r = size * 0.3;

    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = size * 0.08;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,255,136,0.6)';
    ctx.shadowBlur = size * 0.05;

    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy, r * 0.7, Math.PI * 0.3, Math.PI * 1.7);
    ctx.stroke();

    // Head
    ctx.fillStyle = '#00ff88';
    ctx.shadowBlur = size * 0.08;
    ctx.beginPath();
    ctx.arc(cx + r * 0.5, cy - r * 0.15, size * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0e14';
    ctx.beginPath();
    ctx.arc(cx + r * 0.55, cy - r * 0.22, size * 0.025, 0, Math.PI * 2);
    ctx.fill();

    // Coin
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,215,0,0.6)';
    ctx.shadowBlur = size * 0.04;
    ctx.beginPath();
    ctx.arc(cx - r * 0.4, cy + r * 0.5, size * 0.07, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#b8860b';
    ctx.font = `bold ${size * 0.1}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', cx - r * 0.4, cy + r * 0.5 + 1);

    return c.toDataURL('image/png');
}

function download(dataUrl, name) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = name;
    a.click();
}

const d192 = drawIcon(192);
const d512 = drawIcon(512);

document.body.innerHTML += '<p>Icons generated! Downloads starting...</p>';
setTimeout(() => { download(d192, 'icon-192.png'); }, 300);
setTimeout(() => { download(d512, 'icon-512.png'); }, 800);
</script>
</body>
</html>
